name: Mirror production ref

# Vercel's production branch names `fix/python-canonical-runtime`, and that
# setting is not reachable from this repository. So the ref has to stay alive and
# stay current, and `main` has to be the thing anyone actually pushes to. This
# mirrors one onto the other so the Vercel-watched ref is never the branch a
# human has to remember to update.
#
# It force-pushes, and a force-push that does not look before it writes is a
# worse single point of failure than the one it retires. Two guards, in order:
#
#   1. If the refs already match, skip. Otherwise every push to main would
#      produce an empty deploy on Vercel, and a stream of empty deploys is how a
#      real one stops being noticed.
#   2. If the target ref carries commits `main` does not, REFUSE and fail. That
#      is not a mirror falling behind, it is a mirror being asked to delete work,
#      and on 2026-08-07 it would have deleted four commits carrying the very
#      Vercel workarounds that let production build. Reconciling a divergence is
#      a human decision about which side is right; this job does not get to make
#      it silently at force-push speed.
#
# Pushes made with GITHUB_TOKEN do not trigger further Actions runs, so this
# cannot loop, and the gates that ran on `main` do not re-run on the mirrored
# ref. Vercel deploys from its own webhook and is unaffected by that.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Never overlap. Two force-pushes racing can land the older SHA last and leave
  # production behind main with nothing reporting a failure.
  group: mirror-production-ref
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TARGET: fix/python-canonical-runtime
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: This workflow must exist in the tree it is about to mirror
        # A mirror that force-pushes a tree which no longer contains the mirror
        # deletes itself, and does it on the run that also reports success. From
        # then on nothing keeps the Vercel-watched ref alive and nothing says so.
        # The merge of 2026-08-07 removed six workflow files from main in one
        # commit; had this file been among them, the push that carried the
        # deletion would have been the last one to happen.
        run: |
          SELF=".github/workflows/mirror-production-ref.yml"
          if [ ! -f "$SELF" ]; then
            echo "::error::$SELF is absent from the tree being mirrored."
            echo "Pushing it would delete the mirror. Restore the file, then push again."
            exit 1
          fi
          echo "$SELF present; safe to mirror."

      - name: Compare main with the Vercel-watched ref
        id: compare
        run: |
          SRC="$(git rev-parse HEAD)"
          DST="$(git ls-remote origin "refs/heads/$TARGET" | cut -f1)"
          echo "main=$SRC"
          echo "$TARGET=${DST:-<absent>}"
          echo "src=$SRC" >> "$GITHUB_OUTPUT"

          if [ -z "$DST" ]; then
            # The ref is gone. Recreating it is the whole point of this job:
            # a deleted production branch is exactly the failure being retired.
            echo "state=recreate" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$SRC" = "$DST" ]; then
            echo "state=match" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch --no-tags origin "refs/heads/$TARGET:refs/remotes/origin/$TARGET" 2>/dev/null || true
          if git merge-base --is-ancestor "$DST" "$SRC"; then
            echo "state=advance" >> "$GITHUB_OUTPUT"
          else
            echo "state=diverged" >> "$GITHUB_OUTPUT"
            echo "behind<<EOF" >> "$GITHUB_OUTPUT"
            git log --oneline "$SRC..$DST" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          fi

      - name: Already in sync
        if: steps.compare.outputs.state == 'match'
        run: echo "main and $TARGET are the same commit. Nothing pushed, no empty deploy."

      - name: Refuse to discard commits
        if: steps.compare.outputs.state == 'diverged'
        run: |
          echo "::error::$TARGET carries commits main does not. Mirroring would delete them."
          echo "Commits that would be lost:"
          echo "${{ steps.compare.outputs.behind }}"
          echo ""
          echo "Reconcile deliberately, then push main again. Merge them into main if"
          echo "they belong there, or discard them on purpose if they do not. This job"
          echo "will not decide that at force-push speed."
          exit 1

      - name: Mirror main onto the production ref
        if: steps.compare.outputs.state == 'advance' || steps.compare.outputs.state == 'recreate'
        run: |
          git push --force-with-lease origin "HEAD:refs/heads/$TARGET"
          echo "pushed ${{ steps.compare.outputs.src }} to $TARGET"

      - name: Summary
        if: always()
        run: |
          {
            echo "## Mirror production ref"
            echo ""
            echo "- source \`main\` = \`${{ steps.compare.outputs.src }}\`"
            echo "- target \`$TARGET\`"
            echo "- outcome: \`${{ steps.compare.outputs.state }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
