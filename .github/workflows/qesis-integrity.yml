name: QESIS+ integrity gate

# Runs in GitHub's cloud, not on the build machine. The gate reads only the
# committed index, so it needs no OneDrive, no database and no local runtime.
# This is the check whose absence let the v8.0 composite defect reach release.

on:
  push:
    branches: ["**"]
    paths: ["data/**", "eval/**", "scripts/**", "server.py", ".github/workflows/**"]
  pull_request:
    # No paths filter, deliberately. As of 2026-08-12 this workflow is a
    # REQUIRED status check on main. A required check that does not run does
    # not report, and GitHub blocks the merge forever on "Expected, waiting for
    # status". The filter excluded vercel.json and .github/**, so a routing or
    # workflow change alone would have been unmergeable with nothing red to
    # point at. A required check runs on every pull request or it is a trap.
    # (L-092.)
  workflow_dispatch:
  schedule:
    # Ahead of the 08:30 local morning protocol, so a drift is already known.
    - cron: "0 6 * * *"

permissions:
  contents: read

concurrency:
  group: integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The job id IS the status check name GitHub reports. There is no
  # `name:` here, so the check was reported as `gate`, while the branch
  # ruleset on main requires `qesis-integrity`. A required check that
  # never reports blocks every merge forever and shows nothing red, so
  # the failure looks like GitHub being slow. Renamed to match the
  # requirement, which is also the better name: `gate` says nothing
  # about what it gates. (L-093.)
  qesis-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install runtime
        # Before the gates, not after them. The self-test now exercises the
        # served contract, which imports server.py, which needs mcp and
        # pydantic. With this step further down the file the contract cases
        # could not run at all, and one of them passed anyway because an
        # unimportable runtime and a removed declaration both exit 2. A gate
        # that passes for the wrong reason is the failure this repository
        # exists to keep catching.
        run: python -m pip install --quiet --disable-pip-version-check -r requirements.txt

      - name: Kill switch is clear
        # Article 14 Decision 5. Checked before any other gate, because a run that
        # verifies an artefact while the operator is trying to stop the system is
        # answering a question nobody asked.
        run: python scripts/kill_switch.py

      - name: No plaintext secret is reachable
        # D-2. Stdlib only. Prints the file, the line and the variable NAME, and
        # never the value, not even truncated (G-03). A gate that leaks what it
        # guards in order to prove it found it is worse than no gate.
        run: python scripts/verify_no_plaintext_secrets.py

      - name: Integrity gate
        run: python scripts/verify_index.py

      - name: Hash chain reproduces from the committed spine
        # C-01. The endpoint publishes a chain height and a link-break count.
        # Before this step those came from the runtime that appends to the
        # chain, so no reader could contradict them. This recomputes every link
        # from the committed spine and fails if the attestation does not follow.
        run: python scripts/verify_chain.py

      - name: Vintage is paired across both repositories
        # G-01. Neither repository may serve a vintage the other does not
        # record. The public runner cannot read the private repo, so it checks
        # the committed mirror of its lineage register.
        run: python scripts/verify_vintage_pairing.py

      - name: Knowledge graph reproduces from the index
        # KG-1. The graph is derived from data/qesis_v8.json and from nothing
        # else, so a graph that no longer matches a fresh build means either the
        # index moved without the graph or the graph was edited by hand. Both
        # are the same defect: a derived artefact that stopped deriving.
        #
        # The schema fixtures this gate needs live in scripts/test_gate.py under
        # check_graph and run in the step below. That sentence was in
        # build_graph.py's docstring before the fixtures existed, which is the
        # defect this pairing closes: a gate naming fixtures that were not there.
        run: python scripts/build_graph.py --check

      - name: Percolation block reproduces from the evidence
        # PUB-1. The published finding is derived from
        # data/axes/cse_percolation.json and recomputes nothing. This fails if
        # the evidence moved without the artefact, or if the artefact was edited
        # by hand. A publication step that drifts from its evidence is how a
        # withdrawn verdict outlives its withdrawal (EMO-1).
        run: python scripts/build_percolation_block.py --check

      - name: Gate self-test (mutation)
        # A gate that only ever passes proves nothing. This injects each defect
        # class it must catch and fails the build if the gate misses one.
        run: python scripts/test_gate.py

      - name: Server contract smoke test
        run: python scripts/smoke_server.py

      - name: v9.0 SFC axis status matches its measured coverage
        # The axis is WITHHELD at 0 of 35 and must stay that way until a source
        # is admitted. This fails if the declared status ever disagrees with the
        # coverage actually measured.
        run: python scripts/verify_axis_sfc.py --quiet

      - name: SFC ingestion contract refuses what it names
        # Falsifies every clause: revenue, fab count, foreign baselines,
        # announced capacity, aggregate rows, aggregator publishers. Also checks
        # the scaffold's declared minimum_states against the ratio it claims to
        # implement, which is how the 26-vs-27 error was caught.
        run: python scripts/prove_axis_sfc_contract.py

      - name: Public routes are reachable (route AND rewrite)
        # Every public surface needs two halves: a Starlette route matching the
        # ORIGINAL path, and a vercel.json rewrite. /health had a route and no
        # rewrite and 404'd in production for four days while every other check
        # was green. This fails when either half is missing.
        run: python scripts/test_routes.py

      - name: Served contract is fully implemented by this code
        # G-01 code/data atomicity. The index reloads on file change and
        # server.py does not, so a resident process can advance its vintage
        # string while running older code. v8.4 did exactly that in public.
        # CI always starts fresh, so a failure here means the data has genuinely
        # moved past the code and the deploy that would publish the mismatch is
        # stopped before it happens.
        run: python scripts/verify_served_contract.py

      - name: Coupling reproduces the published values
        run: python scripts/coupling.py

      - name: Serverless entry answers MCP over HTTP
        # Catches the two failures that broke the first Vercel wiring: the
        # session manager never starting without lifespan events, and the
        # DNS-rebinding guard rejecting the production Host with 421.
        # No QESIS_ALLOWED_HOSTS override. That variable REPLACES the defaults
        # rather than extending them, and the value set here omitted qesis.eu, so
        # CI was exercising a narrower allowlist than production runs on. A guard
        # tested against a list that is not the shipped list can pass while the
        # apex domain is refused with 421. The defaults in server.py are the
        # thing under test.
        run: python scripts/test_http.py

      - name: Evaluation set is in sync with the index
        # The v8.0 set was hand-written and began failing correct answers the
        # moment the index was corrected. It is generated now, and this check
        # is what keeps it honest.
        run: python scripts/build_eval.py --check

      - name: Landing page is in sync with the index
        # The page is generated from the index, so it must not state a number
        # the index no longer holds. Byte equality is the wrong test: the focus
        # state rotates by day of year, so the numbers are what get compared.
        run: python scripts/build_landing.py --check

      # R1.27. The dashboard is the instrument's own control panel and had no
      # generator and no gate: it served "v8.6 canonical", asserted the trilemma
      # as a measured limitation, and published "4 of 35 pass" with a named state
      # list that no field in the index could produce. A surface nobody gates
      # says whatever it said last. Blocking, exit 1 stops the run. (L-090.)
      - name: Dashboard agrees with the served index
        run: python scripts/verify_dashboard.py

      - name: Service identity is declared once
        run: python scripts/verify_domains.py

      # The outbound half of the same rule. verify_domains.py binds the identity
      # this service answers on; this binds the addresses it dials. The horizon
      # endpoint had reached three copies, and the only one carrying the
      # operator instruction was the one no consumer read. (L-089 family.)
      - name: Outbound endpoints are declared once
        run: python scripts/verify_endpoints.py

      - name: Summary
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          d = json.loads(pathlib.Path("data/qesis_v8.json").read_text(encoding="utf-8"))
          lin, mdl = d.get("lineage", {}), d.get("composite_model", {})
          print(f"## QESIS+ {d.get('vintage')}\n")
          print(f"- formula `{mdl.get('formula_id')}`: `{mdl.get('expression')}`")
          print(f"- states {lin.get('n_countries')}, ranked {lin.get('n_ranked')}, "
                f"EPIS {lin.get('n_epis')}")
          print(f"- generated {lin.get('generated_at_utc')}\n")
          print("| source | sha256 |\n|---|---|")
          for k, v in (lin.get("sources") or {}).items():
              print(f"| `{k}` | `{v['sha256'][:16]}...` |")
          PY
