name: Daily ops report

# SH-7. Nothing depends on the operator's machine.
#
# This workflow exists because the report did not exist for 2026-08-16 to
# 2026-08-22. It was not broken. It was scheduled inside a desktop application
# that was closed, so seven days of runs queued and then fired as one catch-up
# burst at 2026-08-24T15:21:24Z, three tasks at the identical second. A schedule
# that only advances when a human opens an application is a reminder, which is
# exactly what SH-7 says it is.
#
# Scope, declared rather than implied. This runner sees ONE repository. It does
# not see the thesis governance folder on OneDrive, so _GOVERNANCE and _DATABASE
# drift is out of scope here and the report says so in its own text rather than
# reporting a silent zero. D-007: withheld with cause, never imputed.
#
# No cross-repository token. The sibling repository runs its own copy of this
# workflow against itself, and the two reports pair under G-01. A PAT would put
# credential material in the loop for a reporting job, which G-03 and G-04 refuse
# and which is not worth it for a document.

on:
  schedule:
    # 06:20 UTC, ahead of the 08:30 local protocol so a drift is already known,
    # and offset off the hour to dodge runner congestion.
    - cron: "20 6 * * *"
  workflow_dispatch:

permissions:
  # SH-7 needs write: the job commits the report, pushes a branch and opens a
  # pull request. Declaring `contents: read` beside a `git push` is the failure
  # verify_workflow_contract.py C-1 refuses at review time (L-133).
  contents: write
  pull-requests: write

concurrency:
  group: daily-ops-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the full history
        # fetch-depth 0 because the report measures branch divergence and commit
        # dates, and a shallow clone reports both wrongly while exiting zero.
        # SHA pinned per SEC-1. These two SHAs are copied from the workflows in
        # this repository that already pass verify_action_pinning.py, never
        # guessed. L-110: a SHA is resolved by command, not by hand.
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Ledger singleton gate
        # Runs first and does not block the report. R3 degrades here by design:
        # the sibling repository is not checked out, and a checkout boundary must
        # not manufacture an escalation.
        run: python scripts/verify_ledger_singleton.py || true

      - name: Build the report
        id: build
        run: |
          set -o pipefail
          python scripts/build_ops_report.py --out "ops/reports/$(date -u +%F).md" | tee /tmp/report.log
          echo "path=ops/reports/$(date -u +%F).md" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Commit and open a pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          BR="ops/report-${{ steps.build.outputs.date }}"
          git config user.name  "qesis-ops[bot]"
          git config user.email "qesis-ops@users.noreply.github.com"
          if git diff --quiet -- "${{ steps.build.outputs.path }}" && \
             ! git status --porcelain -- "${{ steps.build.outputs.path }}" | grep -q .; then
            echo "report identical to the committed copy, nothing to land"
            exit 0
          fi
          git checkout -B "$BR"
          git add "${{ steps.build.outputs.path }}"
          git commit -m "ops(report): ${{ steps.build.outputs.date }} daily ops report, generated in CI under SH-7"
          git push --force-with-lease origin "$BR"
          # Idempotent: L-108 opened duplicate pull requests by running a block twice.
          if [ -z "$(gh pr list --head "$BR" --state open --json number --jq '.[].number')" ]; then
            gh pr create --base main --head "$BR" \
              --title "ops(report): ${{ steps.build.outputs.date }}" \
              --body "Generated by \`.github/workflows/daily-ops-report.yml\` on the runner. SH-7: nothing depends on the operator's machine. Scope is this repository only; the thesis governance folder is out of scope and the report says so in its own text."
          else
            echo "pull request already open for $BR"
          fi

      - name: Echo the report into the run log
        # An artifact upload was the obvious step here and it is deliberately not
        # taken: actions/upload-artifact has no SHA pinned anywhere in this
        # repository, SEC-1 refuses a mutable tag, and the gate's own instruction
        # is to resolve a SHA by `gh api` and never to guess one. Rather than
        # guess, the report goes to the run log, which needs no action at all.
        # Add the pinned upload step when a resolved SHA exists.
        if: always()
        run: cat "${{ steps.build.outputs.path }}" || echo "no report produced"
