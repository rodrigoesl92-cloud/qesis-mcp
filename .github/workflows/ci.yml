name: CI - fsQCA & Python Gates

on:
  push:
    branches: [ main, fix/vercel-source-pattern ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Debug repo state: package.json, pytest.ini and tree
        run: |
          echo "=== Git commit ==="
          git --no-pager log -1 --pretty=oneline
          echo
          echo "=== Repo root listing ==="
          ls -la
          echo
          echo "=== Show package.json (first 300 chars) ==="
          head -c 300 package.json || echo "(no package.json)"
          echo
          echo "=== Validate package.json JSON ==="
          python -c "import json,sys; json.load(open('package.json')); print('package.json JSON OK')" || (echo "package.json JSON INVALID" && exit 2)
          echo
          echo "=== Show pytest.ini hex head (first 32 bytes) ==="
          xxd -g 1 -l 32 pytest.ini || echo "(no pytest.ini)"
          echo
          echo "=== Show api dir listing ==="
          ls -la api || true

      - name: Run tests
        run: |
          python -m pytest -v --tb=short