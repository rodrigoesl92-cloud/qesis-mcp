name: CI - fsQCA & Python Gates

on:
  push:
    branches: [ phase2/ci-fsqca, main ]
  pull_request:
    branches: [ phase2/ci-fsqca, main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up R
      uses: r-lib/actions/setup-r@v2
      with:
        r-version: '4.3.2'

    - name: Install System Dependencies for R QCA
      run: |
        sudo apt-get update
        sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev libgmp3-dev

    - name: Install R Packages
      run: |
        Rscript -e "install.packages(c('QCA', 'jsonlite', 'readr'), repos='https://cloud.r-project.org/')"

    - name: Run Python Index Integrity Gate
      run: python scripts/verify_index.py

    - name: Run Python Mutation Gate Tests
      run: python scripts/test_gate.py

    - name: Run DAG Engine Test
      run: python scripts/dag_engine.py
