name: Production integrity probe

on:
  push:
    branches: [ main ]
    paths:
      - 'data/**'
      - 'scripts/**'
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

concurrency:
  group: production-integrity-probe
  cancel-in-progress: false

env:
  # single declaration, data/domains.json is the source (L-089)
  QESIS_BASE: https://qesis.qesis.eu

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Served endpoint agrees with the committed index
        # Three outcomes, not two. Serving the PREVIOUS release is a deploy in
        # flight, not a drift, and failing on it makes every deploy red for a
        # few minutes and trains people to ignore this check.
        env:
          PROBE_URL: ${{ env.QESIS_BASE }}
          GRACE_ATTEMPTS: "10"
          GRACE_SLEEP: "30"
        run: |
          python - <<'PY'
          import hashlib, json, os, sys, time, urllib.request

          committed = open("data/qesis_v8.json", "rb").read()
          local_sha = hashlib.sha256(committed).hexdigest()
          local_vintage = json.loads(committed)["vintage"]

          # Every SHA this repo has ever published. Serving one of these is a
          # lagging deploy; serving anything else is unaccounted bytes.
          releases = json.load(open("data/RELEASES.json", encoding="utf-8"))
          known = {r["artifact_sha"] for r in releases.values() if r.get("artifact_sha")}

          attempts = int(os.environ["GRACE_ATTEMPTS"])
          sleep_s = int(os.environ["GRACE_SLEEP"])
          served = None

          for i in range(1, attempts + 1):
              try:
                  with urllib.request.urlopen(os.environ["PROBE_URL"], timeout=25) as r:
                      served = json.load(r)
              except Exception as exc:
                  print(f"attempt {i}: unreachable ({type(exc).__name__})")
                  time.sleep(sleep_s)
                  continue

              sha = served.get("index_sha256")
              if sha == local_sha and served.get("vintage") == local_vintage:
                  break
              if sha in known:
                  print(f"attempt {i}: serving a previous release "
                        f"{str(sha)[:12]}..., deploy in flight")
                  time.sleep(sleep_s)
                  continue
              print(f"::error::served index {str(sha)[:12]}... matches no release "
                    f"in RELEASES.json. This is unaccounted bytes, not a lag.")
              sys.exit(1)

          if served is None:
              print("::warning::endpoint unreachable for the whole grace window. "
                    "Outage, not drift. Not failing the gate on it.")
              sys.exit(0)

          fail = []
          if served.get("vintage") != local_vintage:
              fail.append(f"vintage: served {served.get('vintage')!r} != "
                          f"committed {local_vintage!r} after the grace window")
          if served.get("index_sha256") != local_sha:
              fail.append(f"index_sha256: served {str(served.get('index_sha256'))[:12]}... "
                          f"!= committed {local_sha[:12]}... after the grace window")
          chain = served.get("chain", {})
          if chain.get("status") != "VERIFIED":
              fail.append(f"chain status served as {chain.get('status')!r}")
          if not chain.get("attestation_agrees"):
              fail.append("served chain reports attestation_agrees false")

          print(f"served  {served.get('vintage')}  {str(served.get('index_sha256'))[:12]}...  "
                f"chain {chain.get('status')} {chain.get('entries')}")
          print(f"commit  {local_vintage}  {local_sha[:12]}...")
          for f in fail:
              print(f"::error::{f}")
          sys.exit(1 if fail else 0)
          PY