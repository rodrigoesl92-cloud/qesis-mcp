name: Release binding

# Norms N1 and N2, enforced on any diff that touches published data.
#
# N1: a published label is immutable. If data/qesis_v8.json changes under a
#     label already bound in RELEASES.json, the build fails. Bump the label or
#     file an erratum; do not repoint one.
# N2: a released index must be attested. The artifact hash has to appear in the
#     committed chain spine, so a release cannot go out unbound to the chain.
#
# Runs on data/** and on the scripts that enforce it, because a gate that is not
# exercised when its own logic changes is a gate nobody is checking.

on:
  push:
    paths:
      - "data/**"
      - "scripts/verify_release.py"
      - "scripts/verify_chain.py"
      - ".github/workflows/release-binding.yml"
  pull_request:
    paths:
      - "data/**"
      - "scripts/verify_release.py"
      - "scripts/verify_chain.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-binding-${{ github.ref }}
  cancel-in-progress: true

jobs:
  binding:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Chain recomputes from the committed spine
        # Runs first: N2 asks whether the index is in the spine, which is only a
        # meaningful question once the spine itself is known to be internally
        # consistent.
        run: python scripts/verify_chain.py

      - name: Release binding (N1 immutable label, N2 attested index)
        run: python scripts/verify_release.py

      - name: Gate falsification (the norms must reject a wrong artifact)
        # A gate that only ever runs against a correct artifact has not been
        # shown to reject anything. This also fails the build if a gate rejects
        # by crashing rather than by the norm, which is how the first version of
        # this proof passed for the wrong reason.
        run: python scripts/prove_release_gate.py

      - name: Summary
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import hashlib, json, pathlib
          idx = pathlib.Path("data/qesis_v8.json").read_bytes()
          sha = hashlib.sha256(idx).hexdigest()
          label = json.loads(idx)["vintage"]
          att = json.loads(pathlib.Path("data/chain_attestation.json").read_text("utf-8"))
          lock = json.loads(pathlib.Path("data/RELEASES.json").read_text("utf-8"))
          print(f"## Release binding\n")
          print(f"- label `{label}`")
          print(f"- index `{sha}`")
          print(f"- bound in RELEASES.json: {'yes' if label in lock else '**NO**'}")
          print(f"- chain: {att['entries']} entries, {att['link_breaks']} link breaks")
          print(f"- attested {att['verified_at_utc']} by `{att['verifier']}`")
          PY
