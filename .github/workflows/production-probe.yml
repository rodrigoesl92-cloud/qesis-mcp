name: Production probe

on:
  schedule:
    - cron: "17 * * * *"      # hourly, offset off the hour to dodge runner congestion
  workflow_dispatch:           # lets you run it by hand from the Actions tab

permissions:
  contents: read
  issues: write                # needed to raise an alert

concurrency:
  group: production-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Read the expected index hash from the committed artifact
        id: expect
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import hashlib, pathlib
          sha = hashlib.sha256(pathlib.Path("data/qesis_v8.json").read_bytes()).hexdigest()
          print(f"index_sha={sha}")
          PY

      - name: Probe production
        id: run
        continue-on-error: true
        run: |
          python scripts/verify_production.py "${{ steps.expect.outputs.index_sha }}" "${{ github.sha }}" | tee probe.txt
          echo "exit=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      # L-095. Exit 2 is TRANSPORT: production did not answer, or answered with
      # something that is not JSON. One of those is usually a deploy still
      # propagating. Exit 1 is CERTIFICATION: production answered and disagreed
      # with the committed artefact, which is always real and always pages.
      # The two-strike rule was promised in the issue body from the day it was
      # written and implemented nowhere. A rule held only in prose has been
      # described, not applied (L-054).
      - name: Two-strike gate for transport failures
        id: strike
        if: steps.run.outputs.exit == '2'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const r = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner, repo: context.repo.repo,
              workflow_id: 'production-probe.yml', status: 'completed', per_page: 2
            });
            // The run before this one. If it also failed, this is strike two.
            const prev = r.data.workflow_runs.find(x => x.id !== context.runId);
            const second = prev && prev.conclusion === 'failure';
            core.setOutput('page', second ? 'yes' : 'no');
            core.info(second
              ? 'Second consecutive transport failure. Paging.'
              : 'First transport failure. Holding. Production is not declared down on one miss.');

      - name: Raise an issue if production is not verified
        if: steps.run.outputs.exit == '1' || steps.strike.outputs.page == 'yes'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('fs');
            const out = fs.readFileSync('probe.txt', 'utf8');
            const title = 'Production probe failed';
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'production-probe'
            });
            const body = [
              'The hourly probe could not certify production.',
              '',
              '```',
              out.trim(),
              '```',
              '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `Expected commit: ${context.sha}`,
              '',
              'Note: a `commit bound` failure alone usually means a newer deploy is',
              'still propagating. Two consecutive failures is the real signal.'
            ].join('\n');
            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.data[0].number, body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['production-probe']
              });
            }

      - name: Close the alert when production is healthy again
        if: steps.run.outputs.exit == '0'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'production-probe'
            });
            for (const i of open.data) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: i.number,
                body: 'Production verified 5/5. Closing automatically.'
              });
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: i.number, state: 'closed'
              });
            }

      - name: Fail the run so the Actions tab shows red
        if: steps.run.outputs.exit != '0'
        run: exit 1
