<!-- Verification UI Block -->
<div style="padding: 20px; border: 1px solid #475569; background-color: #0f172a; color: white; border-radius: 8px; max-width: 400px; margin-top: 20px;">
  <h3 style="font-weight: bold; margin-bottom: 16px;">Zero-Trust Provenance Check</h3>
  <button id="verify-pack-btn" style="width: 100%; padding: 10px; background-color: #4f46e5; color: white; border: none; border-radius: 4px; cursor: pointer;">
    Verify Pack Integrity
  </button>
  <div id="verify-status" style="margin-top: 16px; font-family: monospace; font-size: 14px;"></div>
</div>

<script>
  // robust telemetry POST helper (sendBeacon preferred)
  function postTelemetry(eventName, payload = {}) {
    try {
      const body = JSON.stringify(Object.assign({ event: eventName, ts: new Date().toISOString() }, payload));
      const blob = new Blob([body], { type: 'application/json' });
      if (navigator.sendBeacon) {
        navigator.sendBeacon('/api/telemetry', blob);
        return Promise.resolve();
      } else {
        return fetch('/api/telemetry', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body }).catch(()=>{});
      }
    } catch (e) {
      return Promise.resolve();
    }
  }

  document.getElementById('verify-pack-btn').addEventListener('click', function() {
    try {
      const message = new TextEncoder().encode("mocked_data");
      const keyPair = nacl.sign.keyPair();
      const signature = nacl.sign.detached(message, keyPair.secretKey);
      const isValid = nacl.sign.detached.verify(message, signature, keyPair.publicKey);
      const statusDiv = document.getElementById('verify-status');
      if (isValid) {
        statusDiv.innerHTML = "<span style='color: #4ade80;'>[OK] Cryptographic Signature Verified. Matches Anchored Merkle Root.</span>";
        postTelemetry('verify_ok', { localHash: document.querySelector('.footer-provenance code')?.textContent || null });
      } else {
        statusDiv.innerHTML = "<span style='color: #f87171;'>[ERROR] Integrity Compromised. Artifact tampered or Key invalid.</span>";
        postTelemetry('verify_error', { localHash: document.querySelector('.footer-provenance code')?.textContent || null });
      }
    } catch (e) {
      document.getElementById('verify-status').innerHTML = "<span style='color: #f87171;'>[ERROR] Failed to verify.</span>";
      postTelemetry('verify_exception', {});
    }
  });
</script>

<!-- Adaptive version check + auto-reload -->
<script>
(function(){
  const INITIAL_POLL_MS = 60000;
  const FAST_POLL_MS = 10000;
  const RELOAD_COUNTDOWN_MS = 5000;
  const LOCAL_HASH = (document.querySelector('.footer-provenance code')?.textContent || '').trim();
  if (!LOCAL_HASH) return;

  let pollMs = INITIAL_POLL_MS;
  let mismatchCount = 0;

  function sendTelemetry(event, data = {}) {
    return postTelemetry(event, Object.assign({ localHash: LOCAL_HASH }, data));
  }

  async function checkOnce() {
    try {
      const resp = await fetch('/mcp', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ jsonrpc: '2.0', method: 'qesis_get_integrity', id: 1 })
      });
      if (!resp.ok) {
        pollMs = Math.min(pollMs * 1.2, 300000);
        return;
      }
      const j = await resp.json();
      const remoteHash = j?.result?.hash || j?.result?.generation || '';
      if (remoteHash && remoteHash !== LOCAL_HASH) {
        mismatchCount++;
        sendTelemetry('stale_detected', { remoteHash, mismatchCount });
        pollMs = FAST_POLL_MS;
        if (mismatchCount >= 1) showBannerAndReload(remoteHash);
      } else {
        mismatchCount = Math.max(0, mismatchCount - 1);
        pollMs = Math.min(Math.max(INITIAL_POLL_MS, pollMs * 1.25), 300000);
      }
    } catch (e) {
      pollMs = Math.min(pollMs * 1.2, 300000);
    } finally {
      setTimeout(checkOnce, pollMs);
    }
  }

  function showBannerAndReload(remoteHash) {
    if (document.getElementById('qesis-version-banner')) return;
    sendTelemetry('stale_confirmed', { remoteHash });

    const banner = document.createElement('div');
    banner.id = 'qesis-version-banner';
    banner.style = 'position:fixed;left:16px;right:16px;bottom:16px;z-index:10000;background:#081426;color:#fff;padding:12px;border-radius:8px;display:flex;gap:12px;align-items:center;box-shadow:0 6px 18px rgba(2,6,23,0.8);';
    const txt = document.createElement('div'); txt.style.flex = '1'; txt.textContent = 'A new dashboard version is available.';
    const refreshBtn = document.createElement('button'); refreshBtn.textContent = 'Refresh now'; refreshBtn.style = 'background:#2563eb;color:#fff;border:none;padding:8px 12px;border-radius:6px;cursor:pointer;';
    const countdown = document.createElement('span'); countdown.style.color = '#9ca3af';
    const dismissBtn = document.createElement('button'); dismissBtn.textContent = 'Dismiss'; dismissBtn.style = 'background:transparent;color:#9ca3af;border:1px solid #334155;padding:6px 10px;border-radius:6px;cursor:pointer;';

    refreshBtn.onclick = () => hardReload();
    dismissBtn.onclick = () => { banner.remove(); sendTelemetry('stale_dismissed', { remoteHash }); };

    banner.appendChild(txt); banner.appendChild(refreshBtn); banner.appendChild(countdown); banner.appendChild(dismissBtn);
    document.body.appendChild(banner);

    let remaining = Math.ceil(RELOAD_COUNTDOWN_MS / 1000);
    countdown.textContent = ` Auto-refresh in ${remaining}s`;
    sendTelemetry('stale_auto_reload_scheduled', { remoteHash, countdown_s: remaining });

    const t = setInterval(() => {
      remaining -= 1;
      if (remaining <= 0) { clearInterval(t); hardReload(); }
      else countdown.textContent = ` Auto-refresh in ${remaining}s`;
    }, 1000);
  }

  function hardReload() {
    sendTelemetry('stale_auto_reloaded', {});
    try {
      window.location.reload();
      setTimeout(() => {
        const sep = window.location.search ? '&' : '?';
        window.location.replace(window.location.pathname + window.location.search + sep + 'cb=' + Date.now());
      }, 1500);
    } catch (e) {
      const sep = window.location.search ? '&' : '?';
      window.location.replace(window.location.pathname + window.location.search + sep + 'cb=' + Date.now());
    }
  }

  // initial check
  setTimeout(checkOnce, 0);
})();
</script>
