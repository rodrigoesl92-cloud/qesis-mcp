<script>
(function(){
  const INITIAL_POLL_MS = 60_000;   // 60s base baseline
  const FAST_POLL_MS = 10_000;      // 10s accelerated check on mismatch
  const SLOW_POLL_MS = 300_000;     // 5 min back-off when stable
  const AUTO_RELOAD = true;
  const RELOAD_COUNTDOWN_MS = 5000; 

  let pollMs = INITIAL_POLL_MS;
  let mismatchCount = 0;
  
  const localCodeEl = document.querySelector('code');
  const localHash = (localCodeEl && localCodeEl.textContent || '').trim();
  if (!localHash) return;

  function sendTelemetry(event, data = {}) {
    try {
      const payload = { event, data, ts: new Date().toISOString(), localHash };
      const blob = new Blob([JSON.stringify(payload)], { type: 'application/json' });
      if (navigator.sendBeacon) {
        navigator.sendBeacon('/api/telemetry', blob);
      } else {
        fetch('/api/telemetry', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload) }).catch(()=>{});
      }
    } catch (e) {}
  }

  async function checkOnce() {
    try {
      const resp = await fetch('/mcp', {
        method: 'POST',
        headers: { 'Content-Type':'application/json' },
        body: JSON.stringify({ jsonrpc: "2.0", method: "qesis_get_integrity", id: 1 })
      });
      if (!resp.ok) {
        pollMs = Math.min(pollMs * 1.2, SLOW_POLL_MS);
        return;
      }
      const json = await resp.json();
      const remoteHash = json?.result?.hash || json?.result?.generation || '';
      
      if (remoteHash && remoteHash !== localHash) {
        mismatchCount++;
        sendTelemetry('stale_detected', { remoteHash, mismatchCount });
        pollMs = FAST_POLL_MS;
        if (mismatchCount >= 1) {
          showBannerAndReload(remoteHash);
        }
      } else {
        mismatchCount = Math.max(0, mismatchCount - 1);
        pollMs = Math.min(Math.max(INITIAL_POLL_MS, pollMs * 1.25), SLOW_POLL_MS);
      }
    } catch (e) {
      pollMs = Math.min(pollMs * 1.2, SLOW_POLL_MS);
    } finally {
      scheduleNext();
    }
  }

  let timer = null;
  function scheduleNext() {
    clearTimeout(timer);
    timer = setTimeout(checkOnce, pollMs);
  }

  function showBannerAndReload(remoteHash) {
    if (document.getElementById('qesis-version-banner')) return;
    sendTelemetry('stale_confirmed', { remoteHash });
    
    const banner = document.createElement('div');
    banner.id = 'qesis-version-banner';
    banner.style = 'position:fixed;left:16px;right:16px;bottom:16px;z-index:10000;background:#081426;color:#fff;padding:14px 20px;border-radius:8px;display:flex;gap:16px;align-items:center;box-shadow:0 6px 18px rgba(2,6,23,0.8);font-family:sans-serif;font-size:14px;border:1px solid #1e293b;';
    
    const txt = document.createElement('div'); 
    txt.style.flex = '1'; 
    txt.innerHTML = '<strong>System Update Available:</strong> A new governance kernel hash has been deployed.';
    
    const refreshBtn = document.createElement('button'); 
    refreshBtn.textContent = 'Refresh Now'; 
    refreshBtn.style = 'background:#2563eb;color:#fff;border:none;padding:6px 12px;border-radius:4px;cursor:pointer;font-weight:600;';
    refreshBtn.onclick = () => hardReload();
    
    const countdown = document.createElement('span'); 
    countdown.style.color = '#94a3b8';
    
    const dismissBtn = document.createElement('button'); 
    dismissBtn.textContent = 'Dismiss'; 
    dismissBtn.style = 'background:transparent;color:#94a3b8;border:none;cursor:pointer;';
    dismissBtn.onclick = () => { banner.remove(); sendTelemetry('stale_dismissed', { remoteHash }); };
    
    banner.appendChild(txt); 
    banner.appendChild(refreshBtn); 
    banner.appendChild(countdown); 
    banner.appendChild(dismissBtn);
    document.body.appendChild(banner);

    if (AUTO_RELOAD) {
      let remaining = Math.ceil(RELOAD_COUNTDOWN_MS / 1000);
      countdown.innerText = `Auto-refresh in ${remaining}s`;
      sendTelemetry('stale_auto_reload_scheduled', { remoteHash, countdown_s: remaining });
      const t = setInterval(() => {
        remaining -= 1;
        if (remaining <= 0) { 
          clearInterval(t); 
          hardReload(); 
        } else {
          countdown.innerText = `Auto-refresh in ${remaining}s`;
        }
      }, 1000);
    }
  }

  function hardReload(){
    sendTelemetry('stale_auto_reloaded', {});
    try { 
      window.location.reload(true); 
    } catch(e) { 
      window.location.href = window.location.pathname + '?cb=' + Date.now(); 
    }
  }

  checkOnce();
})();
</script>
